name: generate profile cards

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: prepare a world-writable dist directory
        run: mkdir -p dist && chmod 777 dist

      - name: generate snake from the contribution grid
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#22D3EE
            dist/snake-light.svg?palette=github-light&color_snake=#0E7490

      - name: generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&hide_border=true&hide_rank=true&bg_color=0B0F14&title_color=22D3EE&icon_color=A78BFA&text_color=9FB3C8&ring_color=22D3EE
          path: dist/stats.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: generate streak stats card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&hide_border=true&background=0B0F14&stroke=1B2733&ring=22D3EE&fire=A78BFA&currStreakLabel=22D3EE&sideLabels=9FB3C8&currStreakNum=E6EDF3&sideNums=E6EDF3&dates=5D6B7A&border_radius=12
          path: dist/streak.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: generate LeetCode ring card
        run: curl -sf "https://www.readmecodegen.com/api/leetcode-stats?username=ShockRock2004&theme=dark&hard=true&acceptance=true&reputation=true" -o dist/leetcode-ring.svg

      - name: generate LeetCode submission heatmap
        run: |
          curl -sf "https://leetcard.jacoblin.cool/ShockRock2004?theme=dark&ext=heatmap&colors=0B0F14,0B0F14,E6EDF3,9FB3C8,22D3EE,22D3EE,5EEAD4" -o dist/leetcode-heatmap.svg
          # the ext=heatmap card is the stats card with a "Heatmap (Last 52 Weeks)" title, the grid,
          # and date labels appended below it (a fixed 120px strip). Crop tighter still, to just the
          # grid + date labels (92px), dropping the title so the grid gets more width once it's
          # scaled up to match the ring card's display height.
          # the grid spans x 28.65-479.1 and the date labels x 20-480, so the card carries 20px of
          # side padding. Trim that to 10px as well, so the grid reaches closer to the card edge
          # and the card ends closer to the README column edge.
          CROP_H=92
          CROP_X=10
          CROP_W=480
          VB=$(grep -o 'viewBox="[^"]*"' dist/leetcode-heatmap.svg | head -1 | cut -d'"' -f2)
          read -r X Y W H <<< "$VB"
          CROP_Y=$((H - CROP_H))
          # GitHub rewrites an <img height="N"> into max-height:N, which can only shrink an image,
          # never enlarge it. Emit the intrinsic size at 2x the crop so the README's height attribute
          # still has headroom to scale the card up instead of being ignored.
          sed -i "s|viewBox=\"$VB\"|viewBox=\"$CROP_X $CROP_Y $CROP_W $CROP_H\"|; s|width=\"$W\" height=\"$H\"|width=\"$((CROP_W * 2))\" height=\"$((CROP_H * 2))\"|" dist/leetcode-heatmap.svg
          # the card's rounded background rect is drawn at the uncropped card's full size, so the crop
          # would otherwise cut its corners off. Re-fit it to the crop window to match the ring card.
          sed -i "s|#background{transform:translate(0.5px, 0.5px);|#background{transform:translate($CROP_X.5px, $CROP_Y.5px);|; s|width:$((W - 1))px;height:$((H - 1))px;rx:4px|width:$((CROP_W - 1))px;height:$((CROP_H - 1))px;rx:4px|" dist/leetcode-heatmap.svg

      - name: frame the snake card to match the site's dark cards
        run: |
          VB=$(grep -o 'viewBox="[^"]*"' dist/snake.svg | head -1 | cut -d'"' -f2)
          read -r X Y W H <<< "$VB"
          FRAME="<rect x=\"$X\" y=\"$Y\" width=\"$W\" height=\"$H\" rx=\"10\" ry=\"10\" fill=\"#0B0F14\" stroke=\"#1B2733\" stroke-width=\"1\"/>"
          sed -i "s|<svg\([^>]*\)>|<svg\1>${FRAME}|" dist/snake.svg

      - name: push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
