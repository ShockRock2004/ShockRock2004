name: generate profile cards

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # every card is generated independently. One failing (an expired STATS_TOKEN took the whole
      # job down for a month, so the LeetCode cards never refreshed) must not block the others.
      # The publish step replaces the output branch wholesale, so keep the last published cards
      # around to fall back on.
      - name: fetch the last published cards
        uses: actions/checkout@v4
        with:
          ref: output
          path: previous

      - name: prepare a world-writable dist directory
        run: mkdir -p dist && chmod 777 dist

      - name: generate snake from the contribution grid
        uses: Platane/snk@v3
        id: snake
        continue-on-error: true
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#22D3EE
            dist/snake-light.svg?palette=github-light&color_snake=#0E7490

      - name: generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&hide_border=true&hide_rank=true&bg_color=0B0F14&title_color=22D3EE&icon_color=A78BFA&text_color=9FB3C8&ring_color=22D3EE
          path: dist/stats.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - name: generate streak stats card
        uses: DenverCoder1/github-readme-streak-stats@main
        continue-on-error: true
        with:
          options: user=${{ github.repository_owner }}&hide_border=true&background=0B0F14&stroke=1B2733&ring=22D3EE&fire=A78BFA&currStreakLabel=22D3EE&sideLabels=9FB3C8&currStreakNum=E6EDF3&sideNums=E6EDF3&dates=5D6B7A&border_radius=12
          path: dist/streak.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: generate LeetCode ring card
        continue-on-error: true
        run: curl -sf --retry 3 "https://www.readmecodegen.com/api/leetcode-stats?username=ShockRock2004&theme=dark&hard=true&acceptance=true&reputation=true" -o dist/leetcode-ring.svg

      - name: generate LeetCode submission heatmap
        continue-on-error: true
        run: |
          curl -sf --retry 3 "https://leetcard.jacoblin.cool/ShockRock2004?theme=dark&ext=heatmap&colors=0B0F14,0B0F14,E6EDF3,9FB3C8,22D3EE,22D3EE,5EEAD4" -o dist/leetcode-heatmap.svg
          # the ext=heatmap card is the stats card with a "Heatmap (Last 52 Weeks)" title, the grid,
          # and date labels appended below it (a fixed 120px strip). Crop tighter still, to just the
          # grid + date labels (92px), dropping the title so the grid gets more width once it's
          # scaled up to match the ring card's display height.
          # the grid spans x 28.65-479.1 and the date labels x 20-480, so the card carries 20px of
          # side padding. Trim that to 10px as well, so the grid reaches closer to the card edge
          # and the card ends closer to the README column edge.
          CROP_H=92
          CROP_X=10
          CROP_W=480
          VB=$(grep -o 'viewBox="[^"]*"' dist/leetcode-heatmap.svg | head -1 | cut -d'"' -f2)
          read -r X Y W H <<< "$VB"
          CROP_Y=$((H - CROP_H))
          # GitHub rewrites an <img height="N"> into max-height:N, which can only shrink an image,
          # never enlarge it. Emit the intrinsic size at 2x the crop so the README's height attribute
          # still has headroom to scale the card up instead of being ignored.
          sed -i "s|viewBox=\"$VB\"|viewBox=\"$CROP_X $CROP_Y $CROP_W $CROP_H\"|; s|width=\"$W\" height=\"$H\"|width=\"$((CROP_W * 2))\" height=\"$((CROP_H * 2))\"|" dist/leetcode-heatmap.svg
          # the card's rounded background rect is drawn at the uncropped card's full size, so the crop
          # would otherwise cut its corners off. Re-fit it to the crop window to match the ring card.
          sed -i "s|#background{transform:translate(0.5px, 0.5px);|#background{transform:translate($CROP_X.5px, $CROP_Y.5px);|; s|width:$((W - 1))px;height:$((H - 1))px;rx:4px|width:$((CROP_W - 1))px;height:$((CROP_H - 1))px;rx:4px|" dist/leetcode-heatmap.svg

      - name: frame the snake card to match the site's dark cards
        if: steps.snake.outcome == 'success'
        run: |
          VB=$(grep -o 'viewBox="[^"]*"' dist/snake.svg | head -1 | cut -d'"' -f2)
          read -r X Y W H <<< "$VB"
          FRAME="<rect x=\"$X\" y=\"$Y\" width=\"$W\" height=\"$H\" rx=\"10\" ry=\"10\" fill=\"#0B0F14\" stroke=\"#1B2733\" stroke-width=\"1\"/>"
          sed -i "s|<svg\([^>]*\)>|<svg\1>${FRAME}|" dist/snake.svg

      # a card counts as fresh only if it is a real SVG carrying its expected content and not one of
      # the generators' error cards. Anything else is replaced by the last published copy.
      - name: fall back to the last published copy of any card that failed
        run: |
          check() {
            local f=$1 marker=$2
            if grep -q '<svg' "dist/$f" 2>/dev/null && grep -q "$marker" "dist/$f" && ! grep -qiE 'something went wrong|bad credentials' "dist/$f"; then
              echo "fresh: $f"
            elif [ -f "previous/$f" ]; then
              cp "previous/$f" "dist/$f"
              echo "::warning::$f failed to regenerate, republishing the last good copy"
              echo "$f" >> stale.txt
            else
              rm -f "dist/$f"
              echo "::warning::$f failed to regenerate and there is no previous copy"
              echo "$f" >> stale.txt
            fi
          }
          check snake.svg '<svg'
          check snake-light.svg '<svg'
          check stats.svg '<svg'
          check streak.svg '<svg'
          check leetcode-ring.svg 'Solved'
          check leetcode-heatmap.svg 'Heatmap'

      - name: push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # the fresh cards are already published above. Keep the run red anyway so a dead generator
      # gets noticed instead of silently serving a stale card.
      - name: report cards that could not be regenerated
        run: |
          if [ -s stale.txt ]; then
            echo "::error::stale cards: $(tr '\n' ' ' < stale.txt). If stats.svg or streak.svg is listed, STATS_TOKEN has probably expired."
            exit 1
          fi
