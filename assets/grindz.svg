<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360" role="img" aria-label="grindz: a workout tracker shipped as a React Native Android app and an installable PWA on one Supabase backend">
  <title>grindz</title>

  <defs>
    <linearGradient id="gtitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111C26"/>
      <stop offset="100%" stop-color="#0A1119"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="gg" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="scrclip"><rect x="72" y="62" width="152" height="238" rx="14"/></clipPath>

    <style>
      .m   { font-family: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, monospace; }
      .sans{ font-family: "Inter", "Segoe UI Variable Display", "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; }
      .h1  { font-size: 30px; font-weight: 700; }
      .sub { font-size: 11.5px; fill: #6E7D8C; }
      .body{ font-size: 12px; fill: #9FB3C8; }
      .chip{ font-size: 9.5px; fill: #9FE8F5; }
      .feat{ font-size: 11.5px; fill: #C6D4E1; }
      .ui  { font-size: 8.5px; fill: #8593A2; }
      .uib { font-size: 9.5px; fill: #E6EDF3; font-weight: 700; }

      .rise { animation: rise .6s ease-out both; }
      @keyframes rise { from { opacity:0; transform: translateY(10px);} to { opacity:1; transform: translateY(0);} }
      .grow { animation: grow 1.1s ease-out both; transform-origin: left center; }
      @keyframes grow { from { transform: scaleX(0);} to { transform: scaleX(1);} }
      .blink { animation: bl 2.6s ease-in-out infinite; }
      @keyframes bl { 0%,100% { opacity:.4; } 50% { opacity:1; } }
    </style>
  </defs>

  <rect width="1040" height="360" rx="14" fill="#0B0F14" stroke="#1B2733"/>
  <ellipse cx="150" cy="180" rx="120" ry="140" fill="#0E7490" opacity="0.13" filter="url(#gg)"/>

  <!-- phone -->
  <g class="rise">
    <rect x="62" y="52" width="172" height="258" rx="22" fill="#0E151D" stroke="#2A3B4A" stroke-width="2"/>
    <rect x="72" y="62" width="152" height="238" rx="14" fill="url(#scr)"/>
    <rect x="128" y="56" width="40" height="7" rx="3.5" fill="#2A3B4A"/>
    <g clip-path="url(#scrclip)">
      <text class="m uib" x="86" y="86">grindz</text>
      <text class="m ui"  x="86" y="99">push day</text>

      <rect x="86" y="110" width="124" height="34" rx="7" fill="#111C26" stroke="#1E2C3A"/>
      <text class="m ui" x="94" y="124" fill="#C6D4E1">Bench Press</text>
      <rect x="94" y="130" width="92" height="5" rx="2.5" fill="url(#bar)"><animate attributeName="width" values="0;92" dur="1.1s" begin=".35s" fill="freeze"/></rect>
      <text class="m ui" x="192" y="126" text-anchor="end" fill="#5EEAD4">80kg</text>

      <rect x="86" y="150" width="124" height="34" rx="7" fill="#111C26" stroke="#1E2C3A"/>
      <text class="m ui" x="94" y="164" fill="#C6D4E1">Incline DB</text>
      <rect x="94" y="170" width="68" height="5" rx="2.5" fill="url(#bar2)"><animate attributeName="width" values="0;68" dur="1.1s" begin=".5s" fill="freeze"/></rect>
      <text class="m ui" x="192" y="166" text-anchor="end" fill="#C4B5FD">32kg</text>

      <rect x="86" y="190" width="124" height="34" rx="7" fill="#0F2A26" stroke="#1F5A57"/>
      <text class="m ui" x="94" y="204" fill="#C6D4E1">Dips</text>
      <rect x="94" y="210" width="104" height="5" rx="2.5" fill="#34D399"><animate attributeName="width" values="0;104" dur="1.1s" begin=".65s" fill="freeze"/></rect>
      <text class="m ui" x="192" y="206" text-anchor="end" fill="#34D399">PR</text>

      <circle cx="94" cy="246" r="3" fill="#34D399" class="blink"/>
      <text class="m ui" x="103" y="249">synced &#183; offline ready</text>
    </g>
  </g>

  <!-- right column -->
  <g class="rise" style="animation-delay:.12s">
    <text class="sans h1" x="290" y="86" fill="url(#gtitle)">grindz</text>
    <text class="m sub" x="290" y="106">TypeScript &#183; React Native &#183; PWA &#183; Supabase &#183; grindz.dev</text>
  </g>

  <g class="rise" style="animation-delay:.2s">
    <text class="m body" x="290" y="140">A workout tracker I use every session. Log lifts, chase personal records,</text>
    <text class="m body" x="290" y="158">and see exactly what you have trained.</text>
  </g>

  <g class="rise" style="animation-delay:.3s">
    <rect x="290" y="180" width="150" height="24" rx="12" fill="#0B2A2E" stroke="#1F5A57"/>
    <text class="m chip" x="365" y="196" text-anchor="middle">React Native Android</text>
    <rect x="450" y="180" width="130" height="24" rx="12" fill="#0B2A2E" stroke="#1F5A57"/>
    <text class="m chip" x="515" y="196" text-anchor="middle">Installable PWA</text>
    <rect x="590" y="180" width="120" height="24" rx="12" fill="#0B2A2E" stroke="#1F5A57"/>
    <text class="m chip" x="650" y="196" text-anchor="middle">Supabase</text>
    <rect x="720" y="180" width="110" height="24" rx="12" fill="#0B2A2E" stroke="#1F5A57"/>
    <text class="m chip" x="775" y="196" text-anchor="middle">Image CDN</text>
    <rect x="840" y="180" width="110" height="24" rx="12" fill="#0B2A2E" stroke="#1F5A57"/>
    <text class="m chip" x="895" y="196" text-anchor="middle">Signed APK</text>
  </g>

  <g class="rise" style="animation-delay:.4s">
    <line x1="290" y1="226" x2="1006" y2="226" stroke="#1B2733"/>
    <circle cx="298" cy="250" r="3" fill="#22D3EE"/>
    <text class="m feat" x="312" y="254">Two clients on one backend. The data layer is shared so both stay in sync.</text>
    <circle cx="298" cy="278" r="3" fill="#A78BFA"/>
    <text class="m feat" x="312" y="282">Offline first logging. A set recorded without signal still lands correctly.</text>
    <circle cx="298" cy="306" r="3" fill="#34D399"/>
    <text class="m feat" x="312" y="310">Shipped to a real Android device, which is where the interesting bugs live.</text>
  </g>

  <text class="m" x="1006" y="340" text-anchor="end" font-size="10" fill="#3D4855">github.com/ShockRock2004/grindz</text>
</svg>
