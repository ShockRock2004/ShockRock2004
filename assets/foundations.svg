<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="228" viewBox="0 0 1040 228" role="img" aria-label="Subjects currently being learned: system design, computer networks, operating systems, databases, and data structures with competitive programming">
  <title>trying to learn</title>

  <defs>
    <linearGradient id="cardg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111C26"/>
      <stop offset="100%" stop-color="#0C141C"/>
    </linearGradient>
    <filter id="ig" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .m   { font-family: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, monospace; }
      .hd  { font-size: 12px; fill: #8593A2; }
      .t   { font-size: 12.5px; font-weight: 700; fill: #E6EDF3; }
      .s   { font-size: 9.3px; fill: #6E7D8C; }
      .cap { font-size: 10px; fill: #4C5966; }
      .card { animation: fi .5s ease-out both; }
      @keyframes fi { from { opacity:0; transform: translateY(8px);} to { opacity:1; transform: translateY(0);} }
      .ic { animation: pu 3s ease-in-out infinite; }
      @keyframes pu { 0%,100% { opacity:.65; } 50% { opacity:1; } }
    </style>
  </defs>

  <rect width="1040" height="228" rx="14" fill="#0B0F14" stroke="#1B2733"/>
  <text class="m hd" x="24" y="30">trying to learn &#183; alongside building</text>
  <line x1="24" y1="44" x2="1016" y2="44" stroke="#1B2733"/>

  <!-- System Design : stacked layers -->
  <g class="m card" style="animation-delay:.05s">
    <rect x="24" y="66" width="184" height="106" rx="12" fill="url(#cardg)" stroke="#22D3EE" stroke-opacity="0.38"/>
    <g class="ic" transform="translate(40,82)" fill="none" stroke="#22D3EE" stroke-width="1.6" stroke-linejoin="round" filter="url(#ig)">
      <path d="M0 5 L8 1 L16 5 L8 9 Z"/>
      <path d="M0 9.5 L8 13.5 L16 9.5"/>
      <path d="M0 13.5 L8 17.5 L16 13.5"/>
    </g>
    <text class="t" x="66" y="95">System Design</text>
    <text class="s" x="40" y="122">HLD &#183; LLD</text>
    <text class="s" x="40" y="138">scaling &#183; trade offs</text>
    <text class="s" x="40" y="154">design patterns</text>
  </g>

  <!-- Networking : connected nodes -->
  <g class="m card" style="animation-delay:.13s">
    <rect x="228" y="66" width="184" height="106" rx="12" fill="url(#cardg)" stroke="#38BDF8" stroke-opacity="0.38"/>
    <g class="ic" transform="translate(244,82)" stroke="#38BDF8" stroke-width="1.5" filter="url(#ig)" style="animation-delay:.5s">
      <line x1="4" y1="5" x2="14" y2="5"/>
      <line x1="4" y1="5" x2="9" y2="15"/>
      <line x1="14" y1="5" x2="9" y2="15"/>
      <circle cx="4"  cy="5"  r="2.6" fill="#0B0F14"/>
      <circle cx="14" cy="5"  r="2.6" fill="#0B0F14"/>
      <circle cx="9"  cy="15" r="2.6" fill="#0B0F14"/>
    </g>
    <text class="t" x="270" y="95">Networking</text>
    <text class="s" x="244" y="122">TCP/IP &#183; UDP</text>
    <text class="s" x="244" y="138">HTTP &#183; DNS &#183; TLS</text>
    <text class="s" x="244" y="154">sockets &#183; routing</text>
  </g>

  <!-- Operating Systems : cpu chip -->
  <g class="m card" style="animation-delay:.21s">
    <rect x="432" y="66" width="184" height="106" rx="12" fill="url(#cardg)" stroke="#5EEAD4" stroke-opacity="0.38"/>
    <g class="ic" transform="translate(448,82)" fill="none" stroke="#5EEAD4" stroke-width="1.5" filter="url(#ig)" style="animation-delay:1s">
      <rect x="3.5" y="3.5" width="11" height="11" rx="2"/>
      <rect x="7" y="7" width="4" height="4" rx="1"/>
      <line x1="6" y1="0.5" x2="6" y2="3.5"/><line x1="12" y1="0.5" x2="12" y2="3.5"/>
      <line x1="6" y1="14.5" x2="6" y2="17.5"/><line x1="12" y1="14.5" x2="12" y2="17.5"/>
      <line x1="0.5" y1="6" x2="3.5" y2="6"/><line x1="0.5" y1="12" x2="3.5" y2="12"/>
      <line x1="14.5" y1="6" x2="17.5" y2="6"/><line x1="14.5" y1="12" x2="17.5" y2="12"/>
    </g>
    <text class="t" x="474" y="95">Operating Sys</text>
    <text class="s" x="448" y="122">processes &#183; threads</text>
    <text class="s" x="448" y="138">memory &#183; paging</text>
    <text class="s" x="448" y="154">concurrency &#183; locks</text>
  </g>

  <!-- DBMS : database cylinder -->
  <g class="m card" style="animation-delay:.29s">
    <rect x="636" y="66" width="184" height="106" rx="12" fill="url(#cardg)" stroke="#34D399" stroke-opacity="0.38"/>
    <g class="ic" transform="translate(652,82)" fill="none" stroke="#34D399" stroke-width="1.5" filter="url(#ig)" style="animation-delay:1.5s">
      <ellipse cx="9" cy="4" rx="7" ry="2.8"/>
      <path d="M2 4 V14 C2 15.5 5.2 16.8 9 16.8 C12.8 16.8 16 15.5 16 14 V4"/>
      <path d="M2 9 C2 10.5 5.2 11.8 9 11.8 C12.8 11.8 16 10.5 16 9"/>
    </g>
    <text class="t" x="678" y="95">DBMS</text>
    <text class="s" x="652" y="122">indexing &#183; query plans</text>
    <text class="s" x="652" y="138">transactions &#183; ACID</text>
    <text class="s" x="652" y="154">normalisation &#183; SQL</text>
  </g>

  <!-- DSA + CP : binary tree -->
  <g class="m card" style="animation-delay:.37s">
    <rect x="840" y="66" width="176" height="106" rx="12" fill="url(#cardg)" stroke="#A78BFA" stroke-opacity="0.38"/>
    <g class="ic" transform="translate(856,82)" stroke="#A78BFA" stroke-width="1.5" filter="url(#ig)" style="animation-delay:2s">
      <line x1="9" y1="4" x2="4" y2="12"/>
      <line x1="9" y1="4" x2="14" y2="12"/>
      <circle cx="9"  cy="3"  r="2.4" fill="#0B0F14"/>
      <circle cx="4"  cy="13" r="2.4" fill="#0B0F14"/>
      <circle cx="14" cy="13" r="2.4" fill="#0B0F14"/>
    </g>
    <text class="t" x="882" y="95">DSA &#183; CP</text>
    <text class="s" x="856" y="122">graphs &#183; DP &#183; trees</text>
    <text class="s" x="856" y="138">complexity analysis</text>
    <text class="s" x="856" y="154">contest practice</text>
  </g>

  <line x1="24" y1="192" x2="1016" y2="192" stroke="#1B2733"/>
  <text class="m cap" x="24" y="212">the fundamentals behind everything above. still in progress and worth saying so.</text>
</svg>
