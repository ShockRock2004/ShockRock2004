<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1040" height="330" viewBox="0 0 1040 330" role="img" aria-label="Architecture diagram: clients share one data layer, one Supabase backend and one CDN">
  <title>how my projects are wired</title>

  <defs>
    <linearGradient id="boxg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111C26"/>
      <stop offset="100%" stop-color="#0C141C"/>
    </linearGradient>
    <linearGradient id="coreg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B2A2E"/>
      <stop offset="100%" stop-color="#131A2E"/>
    </linearGradient>
    <filter id="pglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="halo" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <style>
      .m   { font-family: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, monospace; }
      .t   { font-size: 15px; font-weight: 700; fill: #E6EDF3; }
      .s   { font-size: 11px; fill: #7D8590; }
      .cap { font-size: 10.5px; fill: #4C5966; }
      .pill{ font-size: 10px; fill: #9FE8F5; }

      .flow { stroke-dasharray: 5 9; animation: flow 1.2s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -14; } }

      .breathe { animation: br 3.4s ease-in-out infinite; }
      @keyframes br { 0%,100% { opacity:.35; } 50% { opacity:.9; } }

      .pop { animation: pop .6s ease-out both; }
      @keyframes pop { from { opacity:0; transform: translateY(8px);} to { opacity:1; transform: translateY(0);} }
    </style>
  </defs>

  <rect width="1040" height="330" rx="14" fill="#0B0F14" stroke="#1B2733"/>

  <text class="m cap" x="24" y="28">how my projects are wired. one source of truth &#183; everything else is a client</text>

  <g fill="none" stroke-linecap="round">
    <path id="p1" d="M220 100 C262 100 262 152 302 152"/>
    <path id="p2" d="M220 224 C262 224 262 176 302 176"/>
    <path id="p3" d="M492 164 L580 164"/>
    <path id="p4" d="M780 134 C818 134 818 100 856 100"/>
    <path id="p5" d="M780 194 C818 194 818 224 856 224"/>
    <use xlink:href="#p1" href="#p1" stroke="#1E3A47" stroke-width="2"/>
    <use xlink:href="#p2" href="#p2" stroke="#1E3A47" stroke-width="2"/>
    <use xlink:href="#p3" href="#p3" stroke="#1E3A47" stroke-width="2"/>
    <use xlink:href="#p4" href="#p4" stroke="#1E3A47" stroke-width="2"/>
    <use xlink:href="#p5" href="#p5" stroke="#1E3A47" stroke-width="2"/>
    <use xlink:href="#p1" href="#p1" stroke="#22D3EE" stroke-width="2" class="flow" opacity="0.8"/>
    <use xlink:href="#p2" href="#p2" stroke="#22D3EE" stroke-width="2" class="flow" opacity="0.8"/>
    <use xlink:href="#p3" href="#p3" stroke="#5EEAD4" stroke-width="2.4" class="flow"/>
    <use xlink:href="#p4" href="#p4" stroke="#A78BFA" stroke-width="2" class="flow" opacity="0.8"/>
    <use xlink:href="#p5" href="#p5" stroke="#A78BFA" stroke-width="2" class="flow" opacity="0.8"/>
  </g>

  <g fill="#67E8F9" filter="url(#pglow)">
    <circle r="4"><animateMotion dur="2.6s" repeatCount="indefinite" begin="0s"><mpath xlink:href="#p1" href="#p1"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="2.6s" repeatCount="indefinite" begin="1.3s"><mpath xlink:href="#p2" href="#p2"/></animateMotion></circle>
    <circle r="4.6" fill="#5EEAD4"><animateMotion dur="1.5s" repeatCount="indefinite" begin="0.4s"><mpath xlink:href="#p3" href="#p3"/></animateMotion></circle>
    <circle r="4.6" fill="#5EEAD4"><animateMotion dur="1.5s" repeatCount="indefinite" begin="1.1s"><mpath xlink:href="#p3" href="#p3"/></animateMotion></circle>
    <circle r="4" fill="#C4B5FD"><animateMotion dur="2.2s" repeatCount="indefinite" begin="0.2s"><mpath xlink:href="#p4" href="#p4"/></animateMotion></circle>
    <circle r="4" fill="#C4B5FD"><animateMotion dur="2.2s" repeatCount="indefinite" begin="1.2s"><mpath xlink:href="#p5" href="#p5"/></animateMotion></circle>
  </g>

  <g class="m pop" style="animation-delay:.05s">
    <rect x="30" y="66" width="190" height="68" rx="12" fill="url(#boxg)" stroke="#22D3EE" stroke-opacity="0.45"/>
    <circle cx="52" cy="100" r="5" fill="#34D399" class="breathe"/>
    <text class="t" x="70" y="95">Android</text>
    <text class="s" x="70" y="113">React Native &#183; Expo</text>
  </g>

  <g class="m pop" style="animation-delay:.15s">
    <rect x="30" y="190" width="190" height="68" rx="12" fill="url(#boxg)" stroke="#22D3EE" stroke-opacity="0.45"/>
    <circle cx="52" cy="224" r="5" fill="#38BDF8" class="breathe" style="animation-delay:1.2s"/>
    <text class="t" x="70" y="219">Web PWA</text>
    <text class="s" x="70" y="237">React &#183; Vite &#183; installable</text>
  </g>

  <g class="m pop" style="animation-delay:.3s">
    <rect x="302" y="122" width="190" height="84" rx="12" fill="url(#boxg)" stroke="#5EEAD4" stroke-opacity="0.5"/>
    <text class="t" x="397" y="156" text-anchor="middle" font-size="14">shared data layer</text>
    <text class="s" x="397" y="176" text-anchor="middle">one set of types</text>
    <text class="s" x="397" y="192" text-anchor="middle">typed end to end</text>
  </g>

  <g class="m pop" style="animation-delay:.45s">
    <ellipse cx="680" cy="164" rx="120" ry="80" fill="#0E7490" opacity="0.16" filter="url(#halo)"/>
    <rect x="580" y="104" width="200" height="120" rx="14" fill="url(#coreg)" stroke="#34D399" stroke-opacity="0.55"/>
    <text class="t" x="680" y="136" text-anchor="middle">Supabase</text>
    <g>
      <rect x="598" y="150" width="74" height="22" rx="11" fill="#0B2A2E" stroke="#1F5A57"/>
      <text class="pill" x="635" y="165" text-anchor="middle">Postgres</text>
      <rect x="686" y="150" width="76" height="22" rx="11" fill="#0B2A2E" stroke="#1F5A57"/>
      <text class="pill" x="724" y="165" text-anchor="middle">Row LS</text>
      <rect x="598" y="182" width="74" height="22" rx="11" fill="#0B2A2E" stroke="#1F5A57"/>
      <text class="pill" x="635" y="197" text-anchor="middle">Auth</text>
      <rect x="686" y="182" width="76" height="22" rx="11" fill="#0B2A2E" stroke="#1F5A57"/>
      <text class="pill" x="724" y="197" text-anchor="middle">Storage</text>
    </g>
  </g>

  <g class="m pop" style="animation-delay:.6s">
    <rect x="856" y="66" width="160" height="68" rx="12" fill="url(#boxg)" stroke="#A78BFA" stroke-opacity="0.45"/>
    <text class="t" x="936" y="95" text-anchor="middle" font-size="14">Image CDN</text>
    <text class="s" x="936" y="113" text-anchor="middle">resized once</text>
  </g>

  <g class="m pop" style="animation-delay:.7s">
    <rect x="856" y="190" width="160" height="68" rx="12" fill="url(#boxg)" stroke="#A78BFA" stroke-opacity="0.45"/>
    <text class="t" x="936" y="219" text-anchor="middle" font-size="14">Ship</text>
    <text class="s" x="936" y="237" text-anchor="middle">Vercel &#183; signed APK</text>
  </g>

  <g class="m">
    <text class="cap" x="248" y="122">reads</text>
    <text class="cap" x="248" y="262">writes</text>
    <text class="cap" x="536" y="156" text-anchor="middle">RPC</text>
  </g>

  <text class="m cap" x="24" y="312">grindz &#183; Lodestar &#183; same spine. the data layer is the part that has to be right.</text>
</svg>
