<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="ShockRock2004. Final year at IIT Madras. Agentic AI, voice AI and telephony.">
  <title>ShockRock2004</title>

  <defs>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7DD3FC" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#7DD3FC" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="vig" cx="50%" cy="45%" r="72%">
      <stop offset="55%"  stop-color="#0B0F14" stop-opacity="0"/>
      <stop offset="100%" stop-color="#04070A" stop-opacity="0.95"/>
    </radialGradient>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="52"/>
    </filter>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#16303E" stroke-width="1"/>
    </pattern>

    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="340" rx="18"/>
    </clipPath>

    <style>
      .sans { font-family: "Inter", "Segoe UI Variable Display", "Segoe UI", -apple-system,
              BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, monospace; }

      .drift  { animation: drift 22s linear infinite; }
      @keyframes drift { to { transform: translate(-44px, -44px); } }

      .blobA { animation: blobA 16s ease-in-out infinite; }
      .blobB { animation: blobB 19s ease-in-out infinite; }
      @keyframes blobA { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(70px,20px) scale(1.12); } }
      @keyframes blobB { 0%,100% { transform: translate(0,0) scale(1.08); } 50% { transform: translate(-84px,-24px) scale(0.94); } }

      /* base state is the finished state. animation runs FROM hidden via fill-mode both,
         so a renderer that ignores CSS animation still shows a complete banner. */
      .brk { stroke-dasharray: 120; animation: draw 2.2s ease-out both; }
      @keyframes draw { from { stroke-dashoffset: 120; } to { stroke-dashoffset: 0; } }

      .fadeUp { animation: fadeUp .9s ease-out both; }
      @keyframes fadeUp { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }

      .pulse { animation: pulse 2.6s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity:.35; } 50% { opacity:1; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="#0B0F14"/>

    <g opacity="0.4">
      <ellipse class="blobA" cx="300" cy="130" rx="200" ry="130" fill="#0E7490" filter="url(#soft)"/>
      <ellipse class="blobB" cx="920" cy="220" rx="220" ry="140" fill="#4C1D95" filter="url(#soft)"/>
    </g>

    <g class="drift" opacity="0.22">
      <rect x="-44" y="-44" width="1288" height="428" fill="url(#grid)"/>
    </g>

    <rect width="1200" height="340" fill="url(#vig)"/>

    <g fill="none" stroke="#22D3EE" stroke-width="1.5" opacity="0.45">
      <path class="brk" d="M34 92 V34 H92"/>
      <path class="brk" d="M1166 92 V34 H1108"/>
      <path class="brk" d="M34 248 V306 H92"/>
      <path class="brk" d="M1166 248 V306 H1108"/>
    </g>

    <g class="fadeUp" style="animation-delay:.1s">
      <text class="mono" x="600" y="116" text-anchor="middle" font-size="12.5" letter-spacing="5.5" fill="#5EEAD4" opacity="0.72">AGENTIC AI &#160;·&#160; VOICE AI &#160;·&#160; TELEPHONY</text>
    </g>

    <g class="fadeUp" style="animation-delay:.3s">
      <text class="sans" x="600" y="200" text-anchor="middle" font-size="78" font-weight="700" letter-spacing="-2" fill="url(#wordmark)">ShockRock2004</text>
    </g>

    <g class="fadeUp" style="animation-delay:.5s">
      <rect x="428" y="224" width="344" height="2" rx="1" fill="url(#rule)"/>
    </g>

    <g class="fadeUp" style="animation-delay:.7s">
      <text class="mono" x="600" y="264" text-anchor="middle" font-size="17" fill="#93A5B8">
        Final year at IIT Madras &#160;·&#160; LLM systems &#160;·&#160; real time voice &#160;·&#160; Python
      </text>
    </g>

    <g class="fadeUp" style="animation-delay:.9s">
      <circle cx="516" cy="294" r="4" fill="#34D399" class="pulse"/>
      <text class="mono" x="530" y="299" font-size="13.5" fill="#6E7B8B">open to SDE roles &#160;·&#160; 2026</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="339" rx="18" fill="none" stroke="#1F2D3D" stroke-width="1"/>
</svg>
