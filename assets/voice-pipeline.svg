<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1040" height="330" viewBox="0 0 1040 330" role="img" aria-label="Real time voice agent pipeline: caller over SIP, media server, streaming speech to text, LLM agent with tools, streaming text to speech, with a per turn latency budget">
  <title>real time voice agent pipeline</title>

  <defs>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111C26"/>
      <stop offset="100%" stop-color="#0C141C"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B2A2E"/>
      <stop offset="100%" stop-color="#131A2E"/>
    </linearGradient>
    <filter id="g" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="halo" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3E5A6B"/>
    </marker>

    <style>
      .m    { font-family: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, monospace; }
      .t    { font-size: 13.5px; font-weight: 700; fill: #E6EDF3; }
      .s    { font-size: 10px; fill: #8593A2; }
      .cap  { font-size: 10.5px; fill: #566673; }
      .lat  { font-size: 9.5px; fill: #5EEAD4; }
      .hd   { font-size: 12px; fill: #8593A2; }

      .flow { stroke-dasharray: 5 9; animation: flow 1.1s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -14; } }

      .pop { animation: pop .55s ease-out both; }
      @keyframes pop { from { opacity:0; transform: translateY(8px);} to { opacity:1; transform: translateY(0);} }

      .breathe { animation: br 3s ease-in-out infinite; }
      @keyframes br { 0%,100% { opacity:.4; } 50% { opacity:1; } }
    </style>
  </defs>

  <rect width="1040" height="330" rx="14" fill="#0B0F14" stroke="#1B2733"/>
  <text class="m hd" x="24" y="30">real time voice agent &#183; one conversational turn</text>

  <g fill="none" stroke-linecap="round">
    <path id="a1" d="M196 148 H250"/>
    <path id="a2" d="M406 148 H460"/>
    <path id="a3" d="M616 148 H670"/>
    <path id="a4" d="M826 148 H880"/>
    <use xlink:href="#a1" href="#a1" stroke="#263D4C" stroke-width="2" marker-end="url(#ah)"/>
    <use xlink:href="#a2" href="#a2" stroke="#263D4C" stroke-width="2" marker-end="url(#ah)"/>
    <use xlink:href="#a3" href="#a3" stroke="#263D4C" stroke-width="2" marker-end="url(#ah)"/>
    <use xlink:href="#a4" href="#a4" stroke="#263D4C" stroke-width="2" marker-end="url(#ah)"/>
    <use xlink:href="#a1" href="#a1" stroke="#22D3EE" stroke-width="2" class="flow" opacity="0.85"/>
    <use xlink:href="#a2" href="#a2" stroke="#22D3EE" stroke-width="2" class="flow" opacity="0.85"/>
    <use xlink:href="#a3" href="#a3" stroke="#5EEAD4" stroke-width="2" class="flow" opacity="0.85"/>
    <use xlink:href="#a4" href="#a4" stroke="#A78BFA" stroke-width="2" class="flow" opacity="0.85"/>
  </g>

  <g filter="url(#g)">
    <circle r="3.6" fill="#67E8F9"><animateMotion dur="1.5s" repeatCount="indefinite"><mpath xlink:href="#a1" href="#a1"/></animateMotion></circle>
    <circle r="3.6" fill="#67E8F9"><animateMotion dur="1.5s" repeatCount="indefinite" begin="0.35s"><mpath xlink:href="#a2" href="#a2"/></animateMotion></circle>
    <circle r="3.6" fill="#5EEAD4"><animateMotion dur="1.5s" repeatCount="indefinite" begin="0.7s"><mpath xlink:href="#a3" href="#a3"/></animateMotion></circle>
    <circle r="3.6" fill="#C4B5FD"><animateMotion dur="1.5s" repeatCount="indefinite" begin="1.05s"><mpath xlink:href="#a4" href="#a4"/></animateMotion></circle>
  </g>

  <g class="m pop" style="animation-delay:.05s">
    <rect x="24" y="112" width="172" height="72" rx="12" fill="url(#box)" stroke="#22D3EE" stroke-opacity="0.4"/>
    <circle cx="44" cy="148" r="4.5" fill="#34D399" class="breathe"/>
    <text class="t" x="60" y="143">Caller</text>
    <text class="s" x="60" y="160">PSTN &#183; SIP trunk</text>
  </g>

  <g class="m pop" style="animation-delay:.14s">
    <rect x="250" y="106" width="156" height="84" rx="12" fill="url(#box)" stroke="#22D3EE" stroke-opacity="0.4"/>
    <text class="t" x="328" y="134" text-anchor="middle">Media Server</text>
    <text class="s" x="328" y="151" text-anchor="middle">FreeSWITCH &#183; WebRTC</text>
    <text class="s" x="328" y="166" text-anchor="middle">VAD &#183; turn taking</text>
  </g>

  <g class="m pop" style="animation-delay:.23s">
    <rect x="460" y="112" width="156" height="72" rx="12" fill="url(#box)" stroke="#5EEAD4" stroke-opacity="0.45"/>
    <text class="t" x="538" y="140" text-anchor="middle">Streaming STT</text>
    <text class="s" x="538" y="157" text-anchor="middle">partial transcripts</text>
  </g>

  <g class="m pop" style="animation-delay:.32s">
    <ellipse cx="748" cy="148" rx="96" ry="66" fill="#0E7490" opacity="0.15" filter="url(#halo)"/>
    <rect x="670" y="100" width="156" height="96" rx="12" fill="url(#core)" stroke="#34D399" stroke-opacity="0.55"/>
    <text class="t" x="748" y="128" text-anchor="middle">LLM Agent</text>
    <text class="s" x="748" y="145" text-anchor="middle">tool calls &#183; state</text>
    <g>
      <rect x="686" y="156" width="58" height="20" rx="10" fill="#0B2A2E" stroke="#1F5A57"/>
      <text class="s" x="715" y="170" text-anchor="middle" fill="#9FE8F5">RAG</text>
      <rect x="752" y="156" width="58" height="20" rx="10" fill="#0B2A2E" stroke="#1F5A57"/>
      <text class="s" x="781" y="170" text-anchor="middle" fill="#9FE8F5">CRM</text>
    </g>
  </g>

  <g class="m pop" style="animation-delay:.41s">
    <rect x="880" y="112" width="136" height="72" rx="12" fill="url(#box)" stroke="#A78BFA" stroke-opacity="0.45"/>
    <text class="t" x="948" y="140" text-anchor="middle">Streaming TTS</text>
    <text class="s" x="948" y="157" text-anchor="middle">first chunk fast</text>
  </g>

  <g class="m">
    <text class="lat" x="223" y="140" text-anchor="middle">30&#8211;80ms</text>
    <text class="lat" x="433" y="140" text-anchor="middle">150&#8211;300ms</text>
    <text class="lat" x="643" y="140" text-anchor="middle">90&#8211;150ms</text>
    <text class="lat" x="853" y="140" text-anchor="middle">TTFT</text>
    <text class="cap" x="223" y="176" text-anchor="middle">carrier</text>
    <text class="cap" x="433" y="176" text-anchor="middle">turn</text>
    <text class="cap" x="643" y="176" text-anchor="middle">text</text>
    <text class="cap" x="853" y="176" text-anchor="middle">token</text>
  </g>

  <g fill="none">
    <path id="rt" d="M948 196 C948 258 700 258 520 258 C340 258 110 258 110 196"/>
    <use xlink:href="#rt" href="#rt" stroke="#3A2E5C" stroke-width="2" marker-end="url(#ah)"/>
    <use xlink:href="#rt" href="#rt" stroke="#A78BFA" stroke-width="2" class="flow" opacity="0.7"/>
    <circle r="3.4" fill="#C4B5FD" filter="url(#g)"><animateMotion dur="3.2s" repeatCount="indefinite"><mpath xlink:href="#rt" href="#rt"/></animateMotion></circle>
  </g>
  <text class="m cap" x="520" y="274" text-anchor="middle">synthesised audio back to the caller &#183; barge in cancels playback mid sentence</text>

  <line x1="24" y1="292" x2="1016" y2="292" stroke="#1B2733"/>
  <text class="m cap" x="24" y="312">budget &#8776; 800 ms per turn. most of it is turn detection and time to first token, not STT or TTS.</text>
</svg>
