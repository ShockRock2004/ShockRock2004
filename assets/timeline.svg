<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="345" viewBox="0 0 1040 345" role="img" aria-label="Timeline of repositories from todo-list in 2025 to grindz in 2026, with rising complexity">
  <title>the trail of evidence</title>

  <defs>
    <linearGradient id="js" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#8A7F2E"/><stop offset="100%" stop-color="#F1E05A"/></linearGradient>
    <linearGradient id="html" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#7A2A15"/><stop offset="100%" stop-color="#E34C26"/></linearGradient>
    <linearGradient id="py" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#1B3A54"/><stop offset="100%" stop-color="#4B8BC8"/></linearGradient>
    <linearGradient id="ts" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#173A63"/><stop offset="100%" stop-color="#4D9BEA"/></linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="20%" stop-color="#22D3EE" stop-opacity=".8"/>
      <stop offset="80%" stop-color="#A78BFA" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <filter id="bglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      .m { font-family: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, monospace; }
      .repo { font-size: 9.8px; fill: #C6D4E1; }
      .st   { font-size: 8.6px; fill: #5D6B7A; }
      .yr   { font-size: 11px;  fill: #4C5966; }
      .hd   { font-size: 12px;  fill: #7D8590; }

      /* base state is drawn and visible. animation replays it FROM hidden via fill-mode both. */
      .trend { stroke-dasharray: 1100; animation: draw 2.6s ease-out .6s both; }
      @keyframes draw { from { stroke-dashoffset: 1100; } to { stroke-dashoffset: 0; } }

      .lab { animation: fi .5s ease-out both; }
      @keyframes fi { from { opacity: 0; } to { opacity: 1; } }

      .tip { animation: tp 2.4s ease-in-out infinite; }
      @keyframes tp { 0%,100% { opacity:.4; } 50% { opacity:1; } }
    </style>
  </defs>

  <rect width="1040" height="345" rx="14" fill="#0B0F14" stroke="#1B2733"/>
  <text class="m hd" x="24" y="30">the trail of evidence. every repo is still public. deleting the early ones would be editing the story.</text>

  <g stroke="#141E28" stroke-width="1">
    <line x1="40" y1="210" x2="1000" y2="210"/>
    <line x1="40" y1="160" x2="1000" y2="160"/>
    <line x1="40" y1="110" x2="1000" y2="110"/>
  </g>

  <!-- default y/height = grown. animation only replays the growth; a static renderer still shows the chart. -->
  <g>
    <rect x="52"  y="230" width="52" height="28"  rx="4" fill="url(#js)"><animate attributeName="y" values="258;230" dur=".8s" begin="0.10s" fill="freeze"/><animate attributeName="height" values="0;28" dur=".8s" begin="0.10s" fill="freeze"/></rect>
    <rect x="164" y="216" width="52" height="42"  rx="4" fill="url(#js)"><animate attributeName="y" values="258;216" dur=".8s" begin="0.25s" fill="freeze"/><animate attributeName="height" values="0;42" dur=".8s" begin="0.25s" fill="freeze"/></rect>
    <rect x="276" y="202" width="52" height="56"  rx="4" fill="url(#js)"><animate attributeName="y" values="258;202" dur=".8s" begin="0.40s" fill="freeze"/><animate attributeName="height" values="0;56" dur=".8s" begin="0.40s" fill="freeze"/></rect>
    <rect x="388" y="188" width="52" height="70"  rx="4" fill="url(#html)"><animate attributeName="y" values="258;188" dur=".8s" begin="0.55s" fill="freeze"/><animate attributeName="height" values="0;70" dur=".8s" begin="0.55s" fill="freeze"/></rect>
    <rect x="500" y="160" width="52" height="98"  rx="4" fill="url(#py)"><animate attributeName="y" values="258;160" dur=".8s" begin="0.70s" fill="freeze"/><animate attributeName="height" values="0;98" dur=".8s" begin="0.70s" fill="freeze"/></rect>
    <rect x="612" y="146" width="52" height="112" rx="4" fill="url(#py)"><animate attributeName="y" values="258;146" dur=".8s" begin="0.85s" fill="freeze"/><animate attributeName="height" values="0;112" dur=".8s" begin="0.85s" fill="freeze"/></rect>
    <rect x="724" y="110" width="52" height="148" rx="4" fill="url(#js)"><animate attributeName="y" values="258;110" dur=".8s" begin="1.00s" fill="freeze"/><animate attributeName="height" values="0;148" dur=".8s" begin="1.00s" fill="freeze"/></rect>
    <rect x="836" y="96"  width="52" height="162" rx="4" fill="url(#py)"><animate attributeName="y" values="258;96"  dur=".8s" begin="1.15s" fill="freeze"/><animate attributeName="height" values="0;162" dur=".8s" begin="1.15s" fill="freeze"/></rect>
    <rect x="948" y="78"  width="52" height="180" rx="4" fill="url(#ts)"><animate attributeName="y" values="258;78"  dur=".8s" begin="1.30s" fill="freeze"/><animate attributeName="height" values="0;180" dur=".8s" begin="1.30s" fill="freeze"/></rect>
  </g>

  <polyline class="trend" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linejoin="round" opacity="0.75" filter="url(#bglow)"
    points="78,230 190,216 302,202 414,188 526,160 638,146 750,110 862,96 974,78"/>

  <g fill="#67E8F9" class="tip">
    <circle cx="974" cy="78" r="5" filter="url(#bglow)"/>
  </g>

  <rect x="40" y="257" width="960" height="2.5" rx="1.25" fill="url(#base)"/>

  <g class="m" text-anchor="middle">
    <g class="lab" style="animation-delay:.9s"><text class="repo" x="78"  y="278">todo-list</text><text class="st" x="78"  y="291">vanilla JS</text></g>
    <g class="lab" style="animation-delay:1.0s"><text class="repo" x="190" y="278">workout</text><text class="st" x="190" y="291">JS &#183; localStorage</text></g>
    <g class="lab" style="animation-delay:1.1s"><text class="repo" x="302" y="278">weekly-plan</text><text class="st" x="302" y="291">JS &#183; state</text></g>
    <g class="lab" style="animation-delay:1.2s"><text class="repo" x="414" y="278">insight</text><text class="st" x="414" y="291">HTML &#183; charts</text></g>
    <g class="lab" style="animation-delay:1.3s"><text class="repo" x="526" y="278">news-intelligence</text><text class="st" x="526" y="291">Python &#183; Docker</text></g>
    <g class="lab" style="animation-delay:1.4s"><text class="repo" x="638" y="278">claude-daily-log</text><text class="st" x="638" y="291">Python &#183; agents</text></g>
    <g class="lab" style="animation-delay:1.5s"><text class="repo" x="750" y="278">Lodestar</text><text class="st" x="750" y="291">React &#183; Expo &#183; Supabase</text></g>
    <g class="lab" style="animation-delay:1.6s"><text class="repo" x="862" y="278">kamar-taj</text><text class="st" x="862" y="291">Python &#183; 4 stars</text></g>
    <g class="lab" style="animation-delay:1.7s"><text class="repo" x="974" y="278">grindz</text><text class="st" x="974" y="291">TypeScript &#183; RN &#183; PWA</text></g>
  </g>

  <g class="m">
    <text class="yr" x="78"  y="315" text-anchor="middle">2025</text>
    <text class="yr" x="526" y="315" text-anchor="middle">&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;  20 months  &#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;&#8212;</text>
    <text class="yr" x="974" y="315" text-anchor="middle">2026</text>
  </g>

  <text class="m st" x="24" y="335" fill="#3D4855">bar height = how much of the stack I had to learn to finish it. not lines of code.</text>
</svg>
