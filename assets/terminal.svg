    <style>
      .m { font-family: ui-monospace, "Cascadia Code", "JetBrains Mono", "Fira Code", Consolas, monospace; font-size: 14px; }
      .p  { fill: #34D399; }
      .cm { fill: #E6EDF3; }
      .o  { fill: #8B98A5; }
      .k  { fill: #67E8F9; }
      .v  { fill: #C4B5FD; }
      .cur { animation: blink 1.05s steps(1,end) infinite; }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      .brd { stroke-dasharray: 6 6; animation: march 1.6s linear infinite; }
      @keyframes march { to { stroke-dashoffset: -12; } }
