<svg xmlns="http://www.w3.org/2000/svg" width="560" height="430" viewBox="0 0 560 430" role="img" aria-label="Radar chart of skill depth across frontend, mobile, backend, Python, DevOps and AI tooling">
  <title>skill radar</title>

  <defs>
    <radialGradient id="rfill" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#67E8F9" stop-opacity="0.55"/>
      <stop offset="70%"  stop-color="#22D3EE" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.16"/>
    </radialGradient>
    <linearGradient id="sweepg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22D3EE" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bgglow" cx="50%" cy="50%" r="60%">
      <stop offset="0%"   stop-color="#0F2C38" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0B0F14" stop-opacity="0"/>
    </radialGradient>
    <filter id="vglow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      .m  { font-family: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, monospace; }
      .lbl { font-size: 13px; fill: #C6D4E1; font-weight: 600; }
      .val { font-size: 11px; fill: #5EEAD4; }

      /* base state is drawn. the reveal runs FROM the hidden state via fill-mode both. */
      .ring { stroke-dasharray: 900; animation: ringdraw 1.5s ease-out both; }
      @keyframes ringdraw { from { stroke-dashoffset: 900; } to { stroke-dashoffset: 0; } }

      .axis { stroke-dasharray: 150; animation: axisdraw 1.1s ease-out both; }
      @keyframes axisdraw { from { stroke-dashoffset: 150; } to { stroke-dashoffset: 0; } }

      .vert { animation: vpulse 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes vpulse { 0%,100% { r: 4.5; opacity: .95; } 50% { r: 6.5; opacity: 1; } }

      .fadein { animation: fi .7s ease-out both; }
      @keyframes fi { from { opacity: 0; } to { opacity: 1; } }
    </style>
  </defs>

  <rect width="560" height="430" rx="14" fill="#0B0F14" stroke="#1B2733"/>
  <ellipse cx="280" cy="215" rx="230" ry="200" fill="url(#bgglow)"/>

  <g fill="none" stroke="#1E2C3A" stroke-width="1.2">
    <polygon class="ring" points="280,75 401.2,145 401.2,285 280,355 158.8,285 158.8,145" style="animation-delay:.05s"/>
    <polygon class="ring" points="280,110 370.9,162.5 370.9,267.5 280,320 189.1,267.5 189.1,162.5" style="animation-delay:.2s"/>
    <polygon class="ring" points="280,145 340.6,180 340.6,250 280,285 219.4,250 219.4,180" style="animation-delay:.35s"/>
    <polygon class="ring" points="280,180 310.3,197.5 310.3,232.5 280,250 249.7,232.5 249.7,197.5" style="animation-delay:.5s"/>
  </g>

  <g stroke="#22374A" stroke-width="1">
    <line class="axis" x1="280" y1="215" x2="280"   y2="75"/>
    <line class="axis" x1="280" y1="215" x2="401.2" y2="145" style="animation-delay:.08s"/>
    <line class="axis" x1="280" y1="215" x2="401.2" y2="285" style="animation-delay:.16s"/>
    <line class="axis" x1="280" y1="215" x2="280"   y2="355" style="animation-delay:.24s"/>
    <line class="axis" x1="280" y1="215" x2="158.8" y2="285" style="animation-delay:.32s"/>
    <line class="axis" x1="280" y1="215" x2="158.8" y2="145" style="animation-delay:.4s"/>
  </g>

  <g>
    <path d="M280 215 L280 60 A155 155 0 0 1 414.2 137.5 Z" fill="url(#sweepg)">
      <animateTransform attributeName="transform" type="rotate" from="0 280 215" to="360 280 215" dur="6.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- default points = final shape. the grow-from-centre is a flourish, not the content. -->
  <polygon fill="url(#rfill)" stroke="#22D3EE" stroke-width="2.5" stroke-linejoin="round"
           points="280,91.8 377,159 367.3,265.4 280,313 213.3,253.5 177,155.5">
    <animate attributeName="points" dur="1.7s" fill="freeze" calcMode="spline"
             keyTimes="0;1" keySplines="0.16 1 0.3 1"
             values="280,215 280,215 280,215 280,215 280,215 280,215;
                     280,91.8 377,159 367.3,265.4 280,313 213.3,253.5 177,155.5"/>
  </polygon>

  <g fill="#67E8F9" filter="url(#vglow)">
    <circle class="vert" cx="280"   cy="91.8"  r="4.5" style="animation-delay:0s"/>
    <circle class="vert" cx="377"   cy="159"   r="4.5" style="animation-delay:.35s"/>
    <circle class="vert" cx="367.3" cy="265.4" r="4.5" style="animation-delay:.7s"/>
    <circle class="vert" cx="280"   cy="313"   r="4.5" style="animation-delay:1.05s"/>
    <circle class="vert" cx="213.3" cy="253.5" r="4.5" style="animation-delay:1.4s"/>
    <circle class="vert" cx="177"   cy="155.5" r="4.5" style="animation-delay:1.75s"/>
  </g>

  <g class="m">
    <g class="fadein" style="animation-delay:1.2s">
      <text class="lbl" x="280" y="42"  text-anchor="middle">Frontend</text>
      <text class="val" x="280" y="57"  text-anchor="middle">React &#183; TS &#183; 88</text>
    </g>
    <g class="fadein" style="animation-delay:1.32s">
      <text class="lbl" x="418" y="128" text-anchor="start">Mobile</text>
      <text class="val" x="418" y="143" text-anchor="start">RN &#183; Expo &#183; 80</text>
    </g>
    <g class="fadein" style="animation-delay:1.44s">
      <text class="lbl" x="418" y="292" text-anchor="start">Backend</text>
      <text class="val" x="418" y="307" text-anchor="start">Supabase &#183; 72</text>
    </g>
    <g class="fadein" style="animation-delay:1.56s">
      <text class="lbl" x="280" y="382" text-anchor="middle">Python</text>
      <text class="val" x="280" y="397" text-anchor="middle">scripts &#183; data &#183; 70</text>
    </g>
    <g class="fadein" style="animation-delay:1.68s">
      <text class="lbl" x="142" y="292" text-anchor="end">DevOps</text>
      <text class="val" x="142" y="307" text-anchor="end">Docker &#183; CI &#183; 55</text>
    </g>
    <g class="fadein" style="animation-delay:1.8s">
      <text class="lbl" x="142" y="128" text-anchor="end">AI tooling</text>
      <text class="val" x="142" y="143" text-anchor="end">agents &#183; 85</text>
    </g>
  </g>

  <g class="m fadein" style="animation-delay:2s">
    <text x="20" y="418" font-size="10.5" fill="#4C5966">self rated &#183; the low number is the honest one</text>
  </g>
</svg>
